name: Test and build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run preview:build
      - name: Verify example article and attachment
        run: |
          test -s .preview/.vitepress/dist/articles/uart.html
          test -s .preview/.vitepress/dist/assets/uart-config.txt
          grep -q 'uart_init' .preview/.vitepress/dist/articles/uart.html
