server {
    listen 80;
    listen [::]:80;
    server_name docs.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://docs.example.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name docs.example.com;
    ssl_certificate /etc/letsencrypt/live/docs.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FeishuTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    root /var/www/feishu-docs/current;
    index index.html;
    charset utf-8;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }


    location ~ /\. { deny all; }
    location ~ ^(/articles/[A-Za-z0-9_-]+)$ {
        if (-f $document_root$1.html) {
            return 301 $1.html$is_args$args;
        }
        return 404;
    }
    location / { try_files $uri $uri.html $uri/ =404; }
    location ~ ^/assets/.*\.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location = /robots.txt { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
